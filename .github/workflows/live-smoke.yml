# TEMPORARY live smoke test — verifies the real wikiart.org crawl with the
# exact pinned environment (Py 3.10 + requirements.txt). Removed before the
# docs/crawl-commands PR is finalized.
name: live-smoke

on:
  push:
    branches: [docs/crawl-commands]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Live crawl wikiart (2 items)
        run: scrapy crawl wikiart -s CLOSESPIDER_ITEMCOUNT=2 -s IMAGES_STORE=/tmp/img -o /tmp/artworks.csv -t csv
      - name: Verify items
        run: |
          python - <<'EOF'
          import csv
          rows = list(csv.DictReader(open('/tmp/artworks.csv')))
          assert len(rows) >= 1, "no items scraped"
          for r in rows:
              assert r["Title"], "empty Title"
              assert r["Author"], "empty Author"
              assert len(r["Id"]) == 40, "Id not 40 chars"
          empty = {k: sum(1 for r in rows if not r[k]) for k in ("Date", "Styles", "Description", "WikiDescription")}
          print("OK: %d live items; empty fields: %s" % (len(rows), empty))
          for r in rows[:3]:
              print(" | ".join([r["Title"], r["Author"], r["Date"], r["Styles"], r["Id"][:8]]))
          EOF
      - name: Verify images downloaded
        run: |
          total=$(find /tmp/img -type f | wc -l)
          nonempty=$(find /tmp/img -type f -size +0 | wc -l)
          echo "images total=$total nonempty=$nonempty"
          test "$total" -ge 1 && test "$nonempty" -ge 1

  smoke-others:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Live crawl artist
        run: scrapy crawl wikiart_artist -s CLOSESPIDER_ITEMCOUNT=1 -o /tmp/artists.csv -t csv
      - name: Live crawl style
        run: scrapy crawl wikiart_style -s CLOSESPIDER_ITEMCOUNT=1 -o /tmp/styles.csv -t csv
      - name: Live crawl movement
        run: scrapy crawl wikiart_movement -s CLOSESPIDER_ITEMCOUNT=1 -o /tmp/movements.csv -t csv
      - name: Live crawl school
        run: scrapy crawl wikiart_school -s CLOSESPIDER_ITEMCOUNT=1 -o /tmp/schools.csv -t csv
      - name: Verify other spiders
        run: |
          python - <<'EOF'
          import csv
          for name in ("artists", "styles", "movements", "schools"):
              rows = list(csv.DictReader(open("/tmp/%s.csv" % name)))
              assert rows, "%s: no items" % name
              empty_desc = sum(1 for r in rows if not r["Description"])
              r = rows[0]
              assert r["Name"], "%s: empty Name" % name
              print("OK %s: %d items, empty Description %d/%d, first Name=%r" % (name, len(rows), empty_desc, len(rows), r["Name"]))
          EOF